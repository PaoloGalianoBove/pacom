[package]
name = "pacom"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
up-rust = "0.9.0"
up-transport-vsomeip = { git = "https://github.com/eclipse-uprotocol/up-transport-vsomeip-rust.git", package = "up-transport-vsomeip" }
up-transport-mqtt5 = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
async-trait = "0.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
