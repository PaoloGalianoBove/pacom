name: pacom-${PACOM_SCENARIO:-rtt}-single-host

x-app-common: &app-common
  image: pacom-demo:latest
  entrypoint: ["/opt/pacom/docker/entrypoint.sh"]
  network_mode: host
  stdin_open: true
  tty: true
  volumes:
    - ipc-single:/tmp
  depends_on:
    router:
      condition: service_healthy

services:
  router:
    image: pacom-demo:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["/opt/pacom/docker/router-entrypoint.sh"]
    network_mode: host
    environment:
      PACOM_VSOMEIP_NODE_UE_IDS: "${APP_A_UE_ID},${APP_B_UE_ID}"
      PACOM_VSOMEIP_UNICAST_IP: "${PACOM_HOST_IP:-127.0.0.1}"
    volumes:
      - ipc-single:/tmp
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/vsomeip-0"]
      interval: 1s
      timeout: 1s
      retries: 15

  app-a:
    <<: *app-common
    environment:
      APP_BIN: "${APP_A_BIN}"
      UP_AUTHORITY: "${APP_A_AUTHORITY}"
      UP_UE_ID: "${APP_A_UE_ID}"
      PACOM_MANIFEST_PATH: "${APP_A_MANIFEST}"
      PACOM_MQTT_BROKER_URI: mqtt://127.0.0.1:1883
      PACOM_CLOUD_AUTHORITY: cloud.bridge

  app-b:
    <<: *app-common
    volumes:
      - ipc-single:/tmp
      - ../../results:/results
    environment:
      APP_BIN: "${APP_B_BIN}"
      UP_AUTHORITY: "${APP_B_AUTHORITY}"
      UP_UE_ID: "${APP_B_UE_ID}"
      PACOM_MANIFEST_PATH: "${APP_B_MANIFEST}"
      PACOM_RTT_OUTPUT_PATH: /results/rtt_measurements_single_host.csv

  mosquitto:
    image: eclipse-mosquitto:1.6
    profiles: ["mqtt"]
    network_mode: host

  cloud-app:
    image: pacom-demo:latest
    profiles: ["mqtt"]
    entrypoint: ["/opt/pacom/docker/entrypoint.sh"]
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      APP_BIN: cloud_app
      UP_AUTHORITY: cloud.bridge
      UP_UE_ID: "0x2200"
      PACOM_MANIFEST_PATH: /opt/pacom/examples/mqtt_bridge/cloud-app/manifest.json
      PACOM_MQTT_BROKER_URI: mqtt://127.0.0.1:1883
      PACOM_CLOUD_AUTHORITY: cloud.bridge
      PACOM_DISABLE_VSOMEIP: "true"
    depends_on:
      - mosquitto

volumes:
  ipc-single: